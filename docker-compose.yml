services:
  app:
    build: .
    container_name: weektodoonline
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 40s

  api:
    build: ./server
    container_name: weektodoonline-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://weektodoonline:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/weektodoonline
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  database:
    image: postgres:17-alpine
    container_name: weektodoonline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: weektodoonline
      POSTGRES_USER: weektodoonline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - weektodoonline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weektodoonline -d weektodoonline"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  weektodoonline-postgres:
