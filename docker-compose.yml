services:
  app:
    build: .
    container_name: weektodoonline
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      POSTGRES_HOST: database
      POSTGRES_DB: weektodoonline
      POSTGRES_USER: weektodoonline
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env}
      STATIC_ROOT: /app/public
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    secrets:
      - postgres_password
      - oidc_client_secret
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  database:
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: weektodoonline-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/run/postgresql:rw,nosuid,nodev,size=16m
    environment:
      POSTGRES_DB: weektodoonline
      POSTGRES_USER: weektodoonline
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - weektodoonline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weektodoonline -d weektodoonline"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  weektodoonline-postgres:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_SECRET_FILE:-./secrets/postgres_password}
  oidc_client_secret:
    file: ${OIDC_CLIENT_SECRET_SECRET_FILE:-./secrets/oidc_client_secret}
